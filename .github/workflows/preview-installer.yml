# GPL-2.0-or-later
# Unsigned PREVIEW CI artifact only. No GitHub Release, code signing,
# services, MSI, firewall changes, or deployment side effects.
name: TJ.RemoteAccess Preview GUI Installer

on:
  push:
    branches:
      - feature/chatgpt-m2-engine-foundation
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - 'TJ.RemoteAccess.sln'
      - '.github/workflows/preview-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview-installer:
    runs-on: windows-latest
    outputs:
      agent_error: ${{ steps.agent_failure.outputs.message }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact GPL source
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify standalone Preview Release compilation
        shell: pwsh
        run: dotnet build .\TJ.RemoteAccess.sln -c Release --nologo

      - name: Test Preview installer and password safety
        shell: pwsh
        run: dotnet test .\tests\TJ.RemoteAccess.Preview.Tests.csproj -c Release --nologo

      # Split the environment-sensitive gates so that the read-only
      # GitHub Actions Jobs API identifies the failing category directly.
      # TRX diagnostics are uploaded even when a required test step fails.
      - name: Validate legacy TLS pinning on Windows Schannel
        shell: pwsh
        run: |
          dotnet test .\tests\TJ.RemoteAccess.Lab.Tests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~LabTlsTests' --logger 'trx;LogFileName=lab-tls.trx' --results-directory .\out\test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Agent inherited handle subprocess IPC
        id: agent_subprocess
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test .\tests\TJ.RemoteAccess.Lab.Tests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~M3AgentExternalProcessTests' --logger 'trx;LogFileName=m3-agent-subprocess.trx' --results-directory .\out\test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture Agent IPC failure details from Windows TRX
        if: always()
        id: agent_failure
        shell: pwsh
        run: |
          if ('${{ steps.agent_subprocess.outcome }}' -ne 'failure') { exit 0 }
          $result = Join-Path $PWD 'out/test-results/m3-agent-subprocess.trx'
          $summary = 'Agent subprocess test failed; see TRX artifact'
          if (Test-Path -LiteralPath $result -PathType Leaf) {
            [xml]$report = Get-Content -LiteralPath $result -Raw
            $failed = $report.SelectSingleNode("//*[local-name()='UnitTestResult' and @outcome='Failed']")
            if ($null -ne $failed) {
              $error = $failed.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='Message']")
              $testName = [string]$failed.testName
              if ($null -ne $error) { $summary = $testName + ': ' + [string]$error.InnerText }
            }
          }
          $summary = ($summary -replace '[\r\n\t]+', ' ' -replace '[^A-Za-z0-9 .:/_()\[\]-]', ' ').Trim()
          if ($summary.Length -gt 160) { $summary = $summary.Substring(0, 160) }
          Write-Host "Agent test failure: $summary"
          "message=$summary" >> $env:GITHUB_OUTPUT

      - name: Enforce Agent subprocess security test
        if: ${{ steps.agent_subprocess.outcome == 'failure' }}
        shell: pwsh
        run: |
          Write-Error 'Required Agent subprocess IPC test failed. Download the Windows TRX diagnostics artifact.'
          exit 1

      - name: Validate Agent same-process pipe HMAC protocol
        shell: pwsh
        run: |
          dotnet test .\tests\TJ.RemoteAccess.Lab.Tests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~M3AgentPipeEndToEndTests' --logger 'trx;LogFileName=m3-agent-pipe.trx' --results-directory .\out\test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate restricted named-pipe Windows token ACL
        shell: pwsh
        run: |
          dotnet test .\tests\TJ.RemoteAccess.Lab.Tests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~M3IpcSecurityTests' --logger 'trx;LogFileName=m3-ipc-acl.trx' --results-directory .\out\test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Agent lock and rebind lifecycle
        shell: pwsh
        run: |
          dotnet test .\tests\TJ.RemoteAccess.Lab.Tests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~M3SessionLifecycleTests' --logger 'trx;LogFileName=m3-session-lifecycle.trx' --results-directory .\out\test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate PowerShell syntax for offline packaging
        shell: pwsh
        run: |
          dotnet test .\tests\TJ.RemoteAccess.Lab.Tests.csproj -c Release --no-build --nologo --filter 'FullyQualifiedName~TJRemoteAccessPowerShellParseTests' --logger 'trx;LogFileName=powershell-syntax.trx' --results-directory .\out\test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run legacy Lab/Agent regression tests
        shell: pwsh
        run: |
          dotnet test .\tests\TJ.RemoteAccess.Lab.Tests.csproj -c Release --no-build --nologo --logger 'trx;LogFileName=lab-regression.trx' --results-directory .\out\test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python delivery policy tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build complete offline GUI installer bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\Build-TJRemoteAccess-Preview-GuiPackage.ps1 -Version '0.5.3-preview'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage one-level installer download for users
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'out\packages\TJ.RemoteAccess-0.5.3-preview-GUI-Installer-win-x64.zip'
          $destination = Join-Path $PWD 'out\packages\gui-installer-download'
          [System.IO.Directory]::CreateDirectory($destination) | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $destination)
          if (-not [System.IO.File]::Exists((Join-Path $destination 'TJ.RemoteAccess.Installer.exe'))) {
            throw 'Installer.exe missing after extracting GUI bundle.'
          }
          if (-not [System.IO.File]::Exists((Join-Path $destination 'TJ.RemoteAccess-0.5.3-preview-win-x64.zip.sha256'))) {
            throw 'SHA-256 sidecar missing from GUI installer download.'
          }

      - name: Upload Windows test diagnostics (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TJ.RemoteAccess-Windows-Tests-${{ github.run_id }}
          path: out/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unsigned double-click installer package
        uses: actions/upload-artifact@v4
        with:
          name: TJ.RemoteAccess-0.5.3-preview-GUI-Installer-win-x64
          path: out/packages/gui-installer-download/
          if-no-files-found: error
          retention-days: 14
  agent-ipc-diagnostic:
    if: ${{ always() && needs['windows-preview-installer'].outputs.agent_error != '' }}
    needs: windows-preview-installer
    name: "Agent failure: ${{ needs['windows-preview-installer'].outputs.agent_error }}"
    runs-on: ubuntu-latest
    steps:
      - name: Report the bounded failing test reason for read-only job status tools
        run: echo "See the preceding Windows TRX diagnostics artifact."
